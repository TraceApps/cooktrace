name: Integration Test Report
description: Try an import, a sign-in provider, or a connected service with your own data and report what worked.
title: '[Integration Test] '
body:
- type: markdown
  attributes:
    value: |
      CookTrace is tested against a small set of recipe sites, archives, and services, so a report from your real data is extremely valuable. Reports of things that work are just as useful as reports of things that don't.
- type: dropdown
  id: integration
  attributes:
    label: Integration
    options:
    - Recipe import from a website
    - Recipe import from a photo or file
    - Mealie archive import
    - Paprika archive import
    - Tandoor archive import
    - Barcode scanning
    - NutriTrace federation
    - Trace AI provider
    - MCP client (Claude Desktop, Cursor, Codex)
    - Sign-in with an OIDC provider
    - Something else
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: CookTrace Version
    description: Shown in **Settings > About**.
    placeholder: e.g. v1.2.0
  validations:
    required: true
- type: input
  id: source
  attributes:
    label: Device, App, or Server Version
    placeholder: e.g. a recipe site's address / Mealie 2.4 export / Paprika 3 archive / Authentik 2025.2
  validations:
    required: false
- type: textarea
  id: worked
  attributes:
    label: What Worked
    value: |
      Mark each with a check, a cross, or n/a.

      - Title and description:
      - Ingredients and amounts:
      - Steps:
      - Photos:
      - Servings and times:
      - Categories and tags:
      - Nutrition:
  validations:
    required: false
- type: textarea
  id: broken
  attributes:
    label: What Didn't Work
    description: Specific entries, wrong values, error messages. Write "Everything worked" if it did.
  validations:
    required: true
- type: textarea
  id: sample
  attributes:
    label: Sample File or Address
    description: A recipe address, or a small archive with personal recipes removed, helps reproduce the problem.
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Logs
    description: |
      **App log:** in CookTrace, open **Settings > Diagnostics**, turn on **Diagnostic Mode**, make the problem happen, then open **View Diagnostic Logs** and copy it.

      **Server log:** `docker logs <container name> --tail 200`

      Remove anything private before posting: email addresses, auth tokens, AI API keys, OIDC client secrets, and your server's address.
    render: text
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots
    description: Drag files into this box.
  validations:
    required: false
